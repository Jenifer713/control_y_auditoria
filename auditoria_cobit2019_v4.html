<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría COBIT 2019 — Grupo 3</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{--primary:#1a5276;--primary-light:#2980b9;--secondary:#27ae60;--accent:#e67e22;--danger:#c0392b;--warning:#f39c12;
--bg:#f4f6f9;--card:#fff;--border:#dce1e8;--text:#2c3e50;--muted:#66768a;--shadow:0 2px 12px rgba(0,0,0,.08);--r:10px;
--input:#fafbfc;--thead:#eef2f7;--hh:70px}
[data-theme="dark"]{--bg:#0f1117;--card:#1a1d2e;--border:#2d3147;--text:#e2e8f0;--muted:#9aa8bb;--shadow:0 2px 12px rgba(0,0,0,.4);
--primary:#3b82f6;--primary-light:#60a5fa;--secondary:#22c55e;--accent:#f97316;--danger:#ef4444;--warning:#eab308;--input:#232640;--thead:#1e2235}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,system-ui,sans-serif;line-height:1.5;padding-bottom:84px;min-width:320px}
button{font-family:inherit}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#1a5276,#2980b9);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{font-size:1.7rem}
.brand h1{font-size:1rem;font-weight:700;line-height:1.25}
.brand p{font-size:.74rem;opacity:.85}
.hctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;list-style:none;display:inline-flex;gap:5px;align-items:center}
.hbtn:hover{background:rgba(255,255,255,.28)}
.hbtn::-webkit-details-marker{display:none}
.btn-ic{display:none;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;font-size:1.1rem;cursor:pointer}
.save-ind{font-size:.74rem;background:rgba(255,255,255,.14);padding:4px 8px;border-radius:6px;white-space:nowrap}
.search{position:relative}
.search input{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;font-size:.8rem;width:210px;outline:none}
.search input::placeholder{color:rgba(255,255,255,.75)}
.sres{position:absolute;top:110%;left:0;width:340px;max-height:320px;overflow:auto;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);display:none;z-index:80}
.sres.show{display:block}
.sres button{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--border);padding:8px 12px;font-size:.82rem;color:var(--text);cursor:pointer}
.sres button:hover,.sres button:focus{background:var(--thead)}
.sres .empty{padding:10px 12px;font-size:.8rem;color:var(--muted)}
details.menu{position:relative}
.menu-list{position:absolute;right:0;top:112%;min-width:260px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:90;padding:4px}
.menu-list button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 12px;border-radius:6px;font-size:.82rem;color:var(--text);cursor:pointer}
.menu-list button:hover{background:var(--thead)}
.menu-list hr{border:none;border-top:1px solid var(--border);margin:4px 0}
/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;padding:12px;align-items:start}
#sidebar{position:sticky;top:calc(var(--hh) + 10px);max-height:calc(100vh - var(--hh) - 100px);overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:8px}
.sec-btn{display:flex;width:100%;justify-content:space-between;align-items:center;background:var(--thead);border:none;border-radius:7px;padding:7px 10px;font-size:.78rem;font-weight:700;color:var(--primary);cursor:pointer;margin:6px 0 3px;text-align:left}
.sitem{display:flex;width:100%;align-items:center;gap:8px;background:none;border:none;border-radius:7px;padding:6px 10px;font-size:.82rem;color:var(--text);cursor:pointer;text-align:left}
.sitem:hover{background:var(--thead)}
.sitem.active,.ochip.active{background:var(--primary);color:#fff}
.sitem .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .cnt{font-size:.68rem;opacity:.8}
.sitem.dom{font-weight:700;border-left:4px solid var(--dc,var(--primary));border-radius:4px 7px 7px 4px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:3px 4px 6px 14px}
.ochip{display:inline-flex;align-items:center;gap:4px;background:var(--thead);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:.7rem;font-weight:600;color:var(--text);cursor:pointer}
.ochip:hover{border-color:var(--primary-light)}
.dot{width:9px;height:9px;border-radius:50%;background:#b8c2cf;display:inline-block;flex-shrink:0}
.dot.started{background:var(--warning)}.dot.done{background:var(--secondary)}
main{min-width:0}
.crumb{font-size:.78rem;color:var(--muted);margin-bottom:8px}
.crumb b{color:var(--primary)}
.progress{display:flex;align-items:center;gap:12px;background:var(--card);padding:9px 16px;border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;border-left:4px solid var(--secondary);flex-wrap:wrap}
.progress .lbl{font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap}
.progress .track{flex:1;min-width:120px;height:10px;background:var(--border);border-radius:5px;overflow:hidden}
.progress .fill{height:100%;width:0;background:linear-gradient(90deg,var(--danger),var(--warning) 50%,var(--secondary));transition:width .4s}
.progress .pct{font-weight:700;color:var(--primary);min-width:40px;text-align:right}
.progress .stepn{font-size:.75rem;color:var(--muted)}
/* ---------- page ---------- */
.page-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-left:6px solid var(--dc,var(--primary));border-radius:var(--r);padding:14px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.page-head h1{font-size:1.15rem;color:var(--dc,var(--primary))}
.page-head p{font-size:.84rem;color:var(--muted);margin-top:3px;max-width:760px}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:12px;background:var(--thead);color:var(--muted)}
.chip.started{background:#fff3cd;color:#856404}.chip.done{background:#d4edda;color:#155724}
[data-theme="dark"] .chip.started{background:#4a3800;color:#fcd34d}[data-theme="dark"] .chip.done{background:#0d4c1f;color:#6ee7a0}
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:.84rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{filter:brightness(1.12)}
.btn-success{background:var(--secondary);color:#fff}.btn-success:hover{filter:brightness(.92)}
.btn-ghost{background:var(--card);color:var(--primary);border:1.5px solid var(--primary)}.btn-ghost:hover{background:var(--primary);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{padding:5px 10px;font-size:.76rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 20px;margin-bottom:12px}
.card h2{font-size:1rem;color:var(--primary);margin-bottom:8px}
h3.tb-title{font-size:.9rem;color:var(--primary);margin:14px 0 4px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg.full{grid-column:1/-1}
.fg label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.fg label .rq{color:var(--danger)}
input,select,textarea{padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:.85rem;background:var(--input);color:var(--text);font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(41,128,185,.15);background:var(--card)}
textarea{resize:vertical;min-height:62px}
.invalid{border-color:var(--danger)!important;background:rgba(192,57,43,.06)}
.static{padding:7px 10px;background:var(--thead);border-radius:7px;font-size:.85rem}
.hint{font-size:.74rem;color:var(--muted);min-height:1em}
.table-wrapper{overflow-x:auto;border:1px solid var(--border);border-radius:8px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:560px}
thead{background:var(--thead)}
th{padding:8px 10px;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--primary);border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
td input,td select,td textarea{padding:4px 7px;font-size:.78rem;min-width:90px}
td textarea{min-height:48px}
tbody tr:hover{background:var(--thead)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary-light);border-radius:8px;padding:10px 14px}
.kpi .label{font-size:.68rem;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .value{font-size:1.35rem;font-weight:700;color:var(--primary)}
.kpi .value.danger{color:var(--danger)}.kpi .value.success{color:var(--secondary)}.kpi .value.warning{color:var(--warning)}
.kpi .sub{font-size:.68rem;color:var(--muted)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;list-style:none}
.member{display:flex;align-items:center;gap:9px;background:var(--thead);border-radius:9px;padding:6px 10px}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.7rem;font-weight:800;flex-shrink:0}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ocard{background:var(--card);border:1px solid var(--border);border-top:4px solid var(--dc);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.ocard .cod{font-weight:800;color:var(--dc)}
.ocard .nm{font-size:.84rem;font-weight:600;flex:1}
.ocard .meta{font-size:.74rem;color:var(--muted)}
.mini{height:5px;background:var(--border);border-radius:3px;overflow:hidden}.mini i{display:block;height:100%;background:var(--secondary)}
.dl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pack{background:var(--card);border:1px solid var(--border);border-top:4px solid var(--dc,var(--primary));border-radius:var(--r);padding:12px 14px}
.pack h4{font-size:.9rem;color:var(--dc,var(--primary))}
.pack small{color:var(--muted);font-size:.74rem}
.pack .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:700}
.b-cumple{background:#d4edda;color:#155724}.b-parcial{background:#fff3cd;color:#856404}.b-nocumple{background:#f8d7da;color:#721c24}
.pend a,.pend button{margin:2px}
/* ---------- bottom bar ---------- */
#bottomBar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(0,0,0,.1);padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
#bottomBar .mid{font-size:.76rem;color:var(--muted);text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bottomBar .btn span.tt{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- toasts / modal ---------- */
#toasts{position:fixed;right:16px;bottom:78px;z-index:9500;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--primary);color:#fff;padding:10px 16px;border-radius:9px;font-size:.83rem;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateX(30px);transition:.3s}
.toast.show{opacity:1;transform:none}.toast.success{background:var(--secondary)}.toast.error{background:var(--danger)}.toast.warning{background:var(--warning);color:#1a1a1a}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9400;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);color:var(--text);border-radius:var(--r);padding:20px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.modal p{margin-bottom:16px;font-size:.9rem}.modal .row{display:flex;gap:8px;justify-content:flex-end}
/* ---------- tour ---------- */
#tourLayer{position:fixed;inset:0;z-index:9000}
#tourSpot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,12,20,.72),0 0 0 3px var(--warning);transition:all .3s;pointer-events:none}
#tourCard{position:fixed;z-index:9100;width:min(340px,calc(100vw - 24px));background:var(--card);color:var(--text);border-top:4px solid var(--warning);border-radius:var(--r);box-shadow:0 12px 40px rgba(0,0,0,.45);padding:16px 18px}
#tourCard h3{font-size:.98rem;color:var(--primary);margin-bottom:6px;display:flex;gap:8px;align-items:center}
#tourCard h3 b{background:var(--warning);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:.76rem}
#tourCard p{font-size:.84rem;color:var(--muted);margin-bottom:12px}
#tourCard .dots{display:flex;gap:5px;margin-bottom:12px}
#tourCard .dots i{width:8px;height:8px;border-radius:50%;background:var(--border)}#tourCard .dots i.on{background:var(--warning);width:20px;border-radius:4px}
#tourCard .acts{display:flex;justify-content:space-between;gap:8px}
/* ---------- responsive ---------- */
@media(max-width:960px){
 .layout{grid-template-columns:1fr;padding:8px}
 .btn-ic{display:inline-block}
 #sidebar{position:fixed;left:0;top:0;bottom:0;width:min(320px,88vw);max-height:none;z-index:70;border-radius:0;transform:translateX(-105%);transition:transform .25s;padding-top:12px}
 body.side-open #sidebar{transform:none}
 body.side-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:65}
 .search input{width:150px}.sres{width:min(340px,90vw)}
 #bottomBar .btn span.tt{display:none}
}
/* ---------- print ---------- */
#printRoot{display:none}
@media print{
 @page{size:A4;margin:12mm}
 body>*:not(#printRoot){display:none!important}
 body{background:#fff!important;padding:0!important}
 #printRoot{display:block!important;color:#000;background:#fff;font-family:Arial,Helvetica,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .pcover{break-after:page;text-align:center;padding-top:30mm}
 .pcover h1{font-size:22pt;color:#1a5276;margin-bottom:8mm}
 .pcover .mode{display:inline-block;border:2px solid #1a5276;color:#1a5276;padding:3px 14px;border-radius:14px;font-weight:700;margin:4mm 0}
 .pcover p{font-size:11pt;margin:2mm 0}
 .pcover ul{list-style:none;margin-top:8mm;font-size:10.5pt;columns:2}
 .pf{break-before:page}
 .pcover+.pf{break-before:auto}
 .pf h2{font-size:14pt;color:#1a5276;border-bottom:2px solid #1a5276;padding-bottom:2mm;margin-bottom:3mm}
 .pf h3{font-size:11pt;margin:5mm 0 2mm}
 .pf .pi{font-size:9.5pt;color:#444;margin-bottom:3mm;font-style:italic}
 .pt{width:100%;min-width:0;border-collapse:collapse;font-size:9.5pt;margin-bottom:3mm}
 .pt th,.pt td{border:1px solid #777;padding:4px 6px;vertical-align:top;text-align:left;color:#000;text-transform:none;letter-spacing:0;white-space:normal}
 .pt.kv th{width:28%;background:#e9eef3}
 .pt.grid th{background:#d6e0ea}
 .pt td.tall{height:22mm}
 .pt tr{break-inside:avoid}.pt thead{display:table-header-group}
}
</style>
</head>
<body>
<header class="top" id="top">
  <button class="btn-ic" id="btnSide" data-do="side" aria-label="Menu">☰</button>
  <div class="brand"><span class="logo">📋</span><div><h1 data-i18n="app_title"></h1><p data-i18n="app_sub"></p></div></div>
  <div class="hctl">
    <div class="search" id="searchBox"><input id="q" type="search" autocomplete="off" data-i18n-ph="search_ph"><div class="sres" id="searchRes"></div></div>
    <span class="save-ind" id="saveInd" aria-live="polite"></span>
    <button class="hbtn" id="btnDownloads" data-go="descargas">⬇ <span data-i18n="downloads"></span></button>
    <details class="menu" id="btnPrint"><summary class="hbtn">🖨 <span data-i18n="print_btn"></span></summary>
      <div class="menu-list">
        <button data-do="print" data-scope="current" data-filled="1" data-i18n="p_cur"></button>
        <button data-do="print" data-scope="all" data-filled="1" data-i18n="p_all"></button>
        <button data-do="print" data-scope="all" data-filled="0" data-i18n="p_all_blank"></button>
      </div></details>
    <button class="hbtn" id="btnTour" data-do="tour">🧭 <span data-i18n="guide"></span></button>
    <button class="hbtn" id="btnLang" data-do="lang"></button>
    <button class="hbtn" id="btnTheme" data-do="theme"></button>
    <details class="menu" id="btnMore"><summary class="hbtn">⋯</summary>
      <div class="menu-list">
        <button data-do="bk_export" data-i18n="bk_export"></button>
        <button data-do="bk_import" data-i18n="bk_import"></button>
        <hr>
        <button data-do="clear" data-i18n="clear_all"></button>
      </div></details>
  </div>
</header>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<div class="layout">
  <aside id="sidebar" aria-label="Navegación"></aside>
  <main>
    <div class="crumb" id="crumb"></div>
    <div class="progress"><span class="lbl" id="progLbl"></span>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progTrack"><div class="fill" id="progFill"></div></div>
      <span class="pct" id="progPct">0%</span><span class="stepn" id="stepN"></span></div>
    <div id="page"></div>
  </main>
</div>

<div id="bottomBar">
  <button class="btn btn-ghost" id="btnPrev" data-do="prev">←&nbsp;<span class="tt"></span></button>
  <div class="mid" id="barMid"></div>
  <button class="btn btn-success" id="btnSave" data-do="save">💾 <span data-i18n="save"></span></button>
  <button class="btn btn-primary" id="btnNext" data-do="next"><span class="tt"></span>&nbsp;→</button>
</div>
<div id="printRoot"></div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return mem[k]!==undefined?mem[k]:null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){mem[k]=v;return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}delete mem[k]}
let lang=lsGet('cobit_lang')==='en'?'en':'es';
const L=o=>o==null?'':typeof o==='string'?o:(o[lang]!==undefined?o[lang]:(o.es!==undefined?o.es:''));
const pad=(n,w=3)=>String(n).padStart(w,'0');
const todayISO=()=>new Date().toISOString().slice(0,10);

/* =====================================================================
   TEXTOS DE LA INTERFAZ (ES / EN)
   ===================================================================== */
const UI={
es:{app_title:'Auditoría de Gobierno y Gestión de I&T — COBIT 2019',app_sub:'Papeles de trabajo · 5 dominios · 40 objetivos · Grupo 3',
search_ph:'Buscar formulario u objetivo…',no_results:'Sin resultados',saved:'Guardado',saving:'Guardando…',saved_at:'Guardado {t}',nosave:'Sin guardado local (use copia .json)',
downloads:'Descargas',print_btn:'Imprimir',guide:'Guía',p_cur:'Imprimir este formulario',p_all:'Imprimir todo con datos',p_all_blank:'Imprimir todo en blanco',

   field: {k,type,es,en,req,full,ph,def,opts,hint,min,max,w}

const FORMS={};
const T=(es,en)=>({es,en});
function getVal(id,def){return Object.prototype.hasOwnProperty.call(STATE,id)?STATE[id]:(def===undefined||def===null?'':def)}
const fid=(f,k)=>f.id+'.'+k;
const cid=(f,tb,i,k)=>f.id+'.'+tb.key+'.'+i+'.'+k;
const extraKey=(f,tb)=>f.id+'.'+tb.key+'.__extra';
function rowCount(f,tb,filled=true){
  if(Array.isArray(tb.rows))return tb.rows.length;
  return tb.rows+(filled&&tb.addable?(parseInt(STATE[extraKey(f,tb)])||0):0);
}
const optsOf=c=>c.opts==='OBJ'?OPT_OBJ:(c.opts||[]);
function disp(c,v){
  if(v===undefined||v===null||v==='')return '';
  if(c.type==='select'){const o=optsOf(c).find(x=>String(x.v)===String(v));return o?L(o):String(v)}
  if(c.type==='number'){const n=Number(v);return isFinite(n)?n:String(v)}
  return String(v);
}
const rowGetter=(f,tb,i)=>k=>{const c=tb.cols.find(x=>x.k===k);return getVal(cid(f,tb,i,k),c&&c.def?c.def(i):'')};
const def=(es,en)=>({es,en});
const reg=f=>{FORMS[f.id]=f;return f};

/* =====================================================================

   ===================================================================== */
const LS_KEY='cobit2019_v4';
let STATE={},saveT=null,warned=false;
function loadState(){
  const raw=lsGet(LS_KEY);
  if(raw){try{const d=JSON.parse(raw);if(d&&d.fields){STATE=d.fields;return}}catch(e){}}
  migrateOld();
}
function migrateOld(){
  const raw=lsGet('cobit2019_audit');if(!raw)return;
  try{const d=JSON.parse(raw),S=(k,v)=>{if(v!==undefined&&v!==null&&v!=='')STATE[k]=v};
   const P=d.portada||{};['entidad','area','periodo','auditor','equipo','fecha_ini','fecha_fin','objetivo'].forEach(k=>S('portada.'+k,P[k]));
   const C=d.contexto||{};['mision','estrategia','estructura','procesos','regulatorio','historial'].forEach(k=>S('contexto.'+k,C[k]));
   S('contexto.madurez',{Baja:'baja',Media:'media',Alta:'alta'}[C.madurez]);
   const rm={'Cumple':'cumple','Parcial':'parcial','No cumple':'nocumple'};
   Object.keys(d.objetivos||{}).forEach(c=>{const o=d.objetivos[c];['auditor','fecha','nivel','meta','evidencia','desc','hallazgo','recom'].forEach(k=>S(c+'.'+k,o[k]));S(c+'.resultado',rm[o.resultado])});
   const I=d.informe||{};const om=s=>!s?'':s.startsWith('Sin')?'sin':s.startsWith('Con')?'con':s.startsWith('Adv')?'adv':'abs';
   S('informe.opinion',om(I.opinion));['conclusiones','limitaciones','recomendaciones','firma','fecha'].forEach(k=>S('informe.'+k,I[k]));
  }catch(e){}
}
function setInd(mode){
  const el=$('#saveInd');if(!el)return;
  if(mode==='saving')el.textContent='⏳ '+t('saving');
  else if(mode==='warn')el.textContent='⚠️ '+t('nosave');
  else el.textContent='💾 '+t('saved_at',{t:new Date().toLocaleTimeString(lang==='es'?'es-EC':'en-US',{hour:'2-digit',minute:'2-digit'})});
}
function scheduleSave(){setInd('saving');clearTimeout(saveT);saveT=setTimeout(saveNow,400)}
function saveNow(){
  clearTimeout(saveT);
  const ok=lsSet(LS_KEY,JSON.stringify({v:4,ts:Date.now(),fields:STATE}));
  setInd(ok?'saved':'warn');
  if(!ok&&!warned){warned=true;toast(t('storage_warn'),'warning',8000)}
  return ok;
}
window.addEventListener('beforeunload',()=>{if(saveT)saveNow()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT)saveNow()});

   ===================================================================== */
function buildIndex(){const ix={};Object.keys(STATE).forEach(k=>{if(k.endsWith('.__extra'))return;const v=STATE[k];if(v===''||v==null)return;ix[k.slice(0,k.indexOf('.'))]=true});return ix}
let IDX={};
function formStats(f){
  let req=0,rf=0;
  (f.fields||[]).forEach(fl=>{if(fl.req){req++;const v=STATE[fid(f,fl.k)];if(v!==undefined&&String(v).trim()!=='')rf++}});
  const any=!!IDX[f.id];
  const pct=req?Math.round(rf/req*100):(any?100:0);
  return {req,rf,any,pct,state:pct>=100&&(req||any)?'done':any?'started':'empty'};
}
function globalProgress(){
  const ids=['portada',...OBJ.map(o=>o.cod.toLowerCase())];
  return Math.round(ids.reduce((s,id)=>s+formStats(FORMS[id]).pct,0)/ids.length);
}

/* =====================================================================
   RENDER: CONTROLES
   ===================================================================== */
function ctl(c,id,v){
  const a=`data-id="${id}" id="${id}"`;
  if(c.type==='select')return `<select ${a}><option value="">—</option>${optsOf(c).map(o=>`<option value="${esc(o.v)}"${String(v)===String(o.v)?' selected':''}>${esc(L(o))}</option>`).join('')}</select>`;
  if(c.type==='textarea')return `<textarea ${a} rows="${c.rows||3}" placeholder="${esc(L(c.ph))}">${esc(v)}</textarea>`;
  if(c.type==='number')return `<input ${a} type="number" ${c.min!==undefined?`min="${c.min}"`:''} ${c.max!==undefined?`max="${c.max}"`:''} step="1" value="${esc(v)}" placeholder="${esc(L(c.ph))}">`;
  return `<input ${a} type="${c.type==='date'?'date':'text'}" value="${esc(v)}" placeholder="${esc(L(c.ph))}">`;
}
function fieldHtml(f,fl){
  const id=fid(f,fl.k);
  if(fl.type==='static')return `<div class="fg${fl.full?' full':''}"><label>${esc(L(fl))}</label><div class="static">${esc(fl.sv())}</div></div>`;
  const v=getVal(id,L(fl.def));
  return `<div class="fg${fl.full?' full':''}"><label for="${id}">${esc(L(fl))}${fl.req?' <span class="rq">*</span>':''}</label>${ctl(fl,id,v)}${fl.hint?`<div class="hint" id="hint:${id}">${esc(fl.hint(v))}</div>`:''}</div>`;
}
function tableHtml(f,tb){
  const n=rowCount(f,tb);
  let h=tb.title?`<h3 class="tb-title">${esc(L(tb.title))}</h3>`:'';
  h+=`<div class="table-wrapper"><table><thead><tr>${tb.cols.map(c=>`<th>${esc(L(c))}</th>`).join('')}</tr></thead><tbody>`;
  for(let i=0;i<n;i++){
    h+='<tr>'+tb.cols.map(c=>{
      if(c.sv)return `<td>${esc(c.sv(i,true))}</td>`;
      if(c.calc)return `<td id="calc:${cid(f,tb,i,c.k)}">${esc(c.calc(rowGetter(f,tb,i),i))}</td>`;
      const id=cid(f,tb,i,c.k);return `<td>${ctl(c,id,getVal(id,c.def?c.def(i):''))}</td>`;
    }).join('')+'</tr>';
  }
  h+='</tbody></table></div>';
  if(tb.addable)h+=`<div style="margin-top:8px"><button class="btn btn-ghost btn-sm" data-do="addrow" data-f="${f.id}" data-t="${tb.key}">＋ ${esc(t('add_row'))}</button></div>`;
  return h;
}
function kpiHtml(f){return f.kpis?f.kpis().map(k=>`<div class="kpi"><div class="label">${esc(k.l)}</div><div class="value ${k.c||''}">${esc(k.v)}</div>${k.s?`<div class="sub">${esc(k.s)}</div>`:''}</div>`).join(''):''}

   <button data-do="xlsx" data-scope="${scope}" data-filled="0">${esc(t('x_empty'))}</button>
   <button data-do="xlsx" data-scope="${scope}" data-filled="1">${esc(t('x_filled'))}</button><hr>
   <button data-do="print" data-scope="${scope}" data-filled="0">${esc(t('p_empty'))}</button>
   <button data-do="print" data-scope="${scope}" data-filled="1">${esc(t('p_filled'))}</button></div></details>`;

const stLabel=s=>t(s==='done'?'st_done':s==='started'?'st_started':'st_empty');

function formPage(f){

  if(f.kpis)h+=`<div class="kpi-grid" id="kpis">${kpiHtml(f)}</div>`;

function pendingList(){

function scopeForms(scope){
  if(scope==='current'){const s=STEP_MAP[current];scope=s.kind==='form'?'form:'+s.id:s.kind==='dom'?'group:'+s.dom:'all'}
  if(scope==='all')return ALL_FORM_IDS.map(id=>FORMS[id]);
  if(scope.startsWith('form:'))return [FORMS[scope.slice(5)]];
  if(scope.startsWith('group:'))return GROUPS[scope.slice(6)].forms.map(id=>FORMS[id]);
  return [];
}
function scopeObjs(scope){
  if(scope==='current'){const s=STEP_MAP[current];scope=s.kind==='form'?'form:'+s.id:s.kind==='dom'?'group:'+s.dom:'all'}
  if(scope==='all')return OBJ;
  if(scope.startsWith('group:')&&DOMS[scope.slice(6)])return OBJ.filter(o=>o.dom===scope.slice(6));
  return null;
}
function resolveScope(scope){if(scope==='current'){const s=STEP_MAP[current];return s.kind==='form'?'form:'+s.id:s.kind==='dom'?'group:'+s.dom:'all'}return scope}
function describeForm(f,filled){
  const d={title:L(f),intro:L(f.intro),color:f.color,fields:[],tables:[]};
  (f.fields||[]).forEach(fl=>{
    let val='';
    if(fl.type==='static')val=fl.sv();else{const dv=L(fl.def);val=disp(fl,filled?getVal(fid(f,fl.k),dv):dv)}
    d.fields.push({label:L(fl),req:!!fl.req,value:val,list:fl.type==='select'?optsOf(fl).map(L):null,tall:fl.type==='textarea',type:fl.type});
  });
  (f.tables||[]).forEach(tb=>{
    const n=rowCount(f,tb,filled),rows=[];
    for(let i=0;i<n;i++)rows.push(tb.cols.map(c=>{
      if(c.sv)return c.sv(i,filled);
      if(c.calc)return filled?c.calc(rowGetter(f,tb,i),i):'';
      const dv=c.def?c.def(i):'';return disp(c,filled?getVal(cid(f,tb,i,c.k),dv):dv);
    }));
    d.tables.push({title:tb.title?L(tb.title):'',headers:tb.cols.map(L),cols:tb.cols.map(c=>({w:c.w||16,type:c.type,list:c.type==='select'?optsOf(c).map(L):null})),rows});
  });
  return d;
}
function describeSummary(objs,filled){
  const hd=lang==='es'?['Código','Dominio','Objetivo','Auditor','Fecha','Nivel actual','Nivel meta','Brecha','Resultado','Ref. evidencia','Descripción','Hallazgos','Recomendación']:['Code','Domain','Objective','Auditor','Date','Current level','Target level','Gap','Result','Evidence ref.','Description','Findings','Recommendation'];
  const rows=objs.map(o=>{const c=o.cod.toLowerCase(),g=k=>filled?getVal(c+'.'+k,''):'';const n=g('nivel'),m=g('meta');
    return [o.cod,o.dom,L(o),g('auditor'),g('fecha'),n!==''?+n:'',m!==''?+m:'',(n!==''&&m!=='')?+m-+n:'',filled?disp({type:'select',opts:OPT_RES},g('resultado')):'',g('evidencia'),g('desc'),g('hallazgo'),g('recom')]});
  return {title:lang==='es'?'Resumen de objetivos COBIT 2019':'COBIT 2019 objectives summary',intro:'',fields:[],tables:[{title:'',headers:hd,cols:[10,9,44,18,12,12,12,9,14,14,34,34,34].map(w=>({w})),rows}],freeze:true};
}

/* =====================================================================
   EXCEL (ExcelJS)
   ===================================================================== */
const XL={titleBg:{argb:'FF1A5276'},headerBg:{argb:'FF2980B9'},band:{argb:'FFEAF2F8'},white:{argb:'FFFFFFFF'},lab:{argb:'FFE3ECF4'},line:{style:'thin',color:{argb:'FFB0BEC5'}}};
const xb=()=>({top:XL.line,left:XL.line,bottom:XL.line,right:XL.line});
const solid=c=>({type:'pattern',pattern:'solid',fgColor:c});
function listRef(wb,ctx,labels){
  const key=labels.join('\u0001');if(ctx.lists[key])return ctx.lists[key];
  if(!ctx.ls){ctx.ls=wb.addWorksheet('Listas',{state:'hidden'});ctx.nc=1}
  const col=ctx.nc++;labels.forEach((v,i)=>{ctx.ls.getCell(i+1,col).value=v});
  const L_=ctx.ls.getColumn(col).letter,ref="Listas!$"+L_+"$1:$"+L_+"$"+labels.length;ctx.lists[key]=ref;return ref;
}
function uniqName(ctx,raw){
  let base=String(raw).replace(/[\\\/\?\*\[\]:]/g,' ').replace(/\s+/g,' ').trim().slice(0,31)||'Hoja',n=base,i=2;
  while(ctx.names.has(n.toLowerCase())||n.toLowerCase()==='listas'){const s=' ('+i++ +')';n=base.slice(0,31-s.length)+s}
  ctx.names.add(n.toLowerCase());return n;
}
function writeSheet(wb,ctx,name,d,color){
  const ws=wb.addWorksheet(uniqName(ctx,name),{properties:color?{tabColor:{argb:'FF'+color.replace('#','').toUpperCase()}}:{}});
  const tcols=d.tables.reduce((m,x)=>Math.max(m,x.headers.length),0),ncol=Math.max(d.fields.length?3:1,tcols);
  const w=[];for(let j=0;j<ncol;j++){let m=14;d.tables.forEach(tb=>{if(tb.cols[j])m=Math.max(m,tb.cols[j].w||14)});w.push(m)}
  if(d.fields.length)w[0]=Math.max(w[0],32);
  w.forEach((x,i)=>{ws.getColumn(i+1).width=x});
  let r=1;
  if(ncol>1)ws.mergeCells(r,1,r,ncol);
  const tc=ws.getCell(r,1);tc.value=d.title;tc.font={bold:true,size:14,color:{argb:'FFFFFFFF'}};tc.fill=solid(XL.titleBg);tc.alignment={horizontal:'left',vertical:'middle',indent:1};
  for(let j=1;j<=ncol;j++)ws.getCell(r,j).border=xb();ws.getRow(r).height=28;r++;
  if(d.intro){if(ncol>1)ws.mergeCells(r,1,r,ncol);const ic=ws.getCell(r,1);ic.value=d.intro;ic.font={italic:true,size:9,color:{argb:'FF566573'}};ic.alignment={wrapText:true,vertical:'middle'};ws.getRow(r).height=Math.max(18,15*Math.ceil(d.intro.length/(w.reduce((a,b)=>a+b,0)*1.05)));r++}
  r++;
  const vw=w.slice(1).reduce((a,b)=>a+b,0)||40;
  d.fields.forEach(fl=>{
    const lc=ws.getCell(r,1);lc.value=fl.label+(fl.req?' *':'');lc.font={bold:true,size:10};lc.fill=solid(XL.lab);lc.border=xb();lc.alignment={vertical:'middle',wrapText:true};
    if(ncol>2)ws.mergeCells(r,2,r,ncol);
    const vc=ws.getCell(r,2);vc.value=(fl.type==='number'&&fl.value!==''&&isFinite(Number(fl.value)))?Number(fl.value):fl.value;vc.font={size:10};vc.alignment={vertical:fl.tall?'top':'middle',wrapText:true};
    for(let j=2;j<=ncol;j++)ws.getCell(r,j).border=xb();
    if(fl.list)vc.dataValidation={type:'list',allowBlank:true,formulae:[listRef(wb,ctx,fl.list)],showErrorMessage:true,errorTitle:'—',error:fl.list.join(' / ').slice(0,200)};
    ws.getRow(r).height=fl.tall?Math.max(48,Math.min(220,15*Math.ceil(((String(fl.value).length)||1)/(vw*1.0))+8)):22;
    r++;
  });
  if(d.fields.length)r++;
  let hdrRow=0,lastRow=0;
  d.tables.forEach(tb=>{
    if(tb.title){if(ncol>1)ws.mergeCells(r,1,r,ncol);const c=ws.getCell(r,1);c.value=tb.title;c.font={bold:true,size:11,color:{argb:'FF1A5276'}};r++}
    const hr=ws.getRow(r);tb.headers.forEach((h,i)=>{const c=hr.getCell(i+1);c.value=h;c.font={bold:true,size:10,color:{argb:'FFFFFFFF'}};c.fill=solid(XL.headerBg);c.border=xb();c.alignment={horizontal:'center',vertical:'middle',wrapText:true}});
    hr.height=30;if(!hdrRow)hdrRow=r;r++;const first=r;
    tb.rows.forEach((row,ri)=>{
      const rr=ws.getRow(r);
      row.forEach((v,ci)=>{
        const c=rr.getCell(ci+1),cd=tb.cols[ci]||{};
        c.value=(cd.type==='number'&&v!==''&&isFinite(Number(v)))?Number(v):v;
        c.border=xb();c.font={size:10};c.fill=solid(ri%2?XL.band:XL.white);
        c.alignment={vertical:'middle',wrapText:true,horizontal:typeof c.value==='number'?'center':'left'};
        if(cd.list)c.dataValidation={type:'list',allowBlank:true,formulae:[listRef(wb,ctx,cd.list)],showErrorMessage:true,errorTitle:'—',error:cd.list.slice(0,12).join(' / ').slice(0,200)};
      });
      const longest=row.reduce((m,v,ci)=>Math.max(m,Math.ceil(String(v==null?'':v).length/Math.max(8,(tb.cols[ci]&&tb.cols[ci].w||14)*1.05))),1);
      rr.height=Math.max(20,Math.min(150,15*longest+4));r++;
    });
    lastRow=r-1;
    if(d.tables.length===1&&tb.rows.length&&!d.fields.length)ws.autoFilter={from:{row:first-1,column:1},to:{row:lastRow,column:tb.headers.length}};
    r++;
  });
  if(d.tables.length===1&&!d.fields.length&&hdrRow)ws.views=[{state:'frozen',ySplit:hdrRow}];
  ws.pageSetup={orientation:ncol>5?'landscape':'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9};
  return ws;
}
function buildWorkbook(scope,filled){
  scope=resolveScope(scope);
  const wb=new ExcelJS.Workbook();wb.creator='GRUPO 3 · COBIT 2019';wb.created=new Date();
  const ctx={names:new Set(),lists:{},ls:null,nc:1},os=scopeObjs(scope);
  if(os)writeSheet(wb,ctx,lang==='es'?'Resumen_Objetivos':'Objectives_Summary',describeSummary(os,filled),scope.startsWith('group:')?DOMS[scope.slice(6)].color:'#1a5276');
  scopeForms(scope).forEach(f=>writeSheet(wb,ctx,f.code||L(f),describeForm(f,filled),f.color));
  return wb;
}
function fileName(scope,filled){
  scope=resolveScope(scope);
  const sfx=lang==='es'?(filled?'Lleno':'Vacio'):(filled?'Filled':'Blank');
  const nm=scope==='all'?(lang==='es'?'Todo':'All'):scope.startsWith('form:')?scope.slice(5).toUpperCase():scope.slice(6);
  return 'COBIT2019_'+nm+'_'+sfx+'.xlsx';
}
async function xlDownload(wb,filename){
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  dlBlob(blob,filename);
}
function dlBlob(blob,filename){
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
}
async function exportXlsx(scope,filled){
  if(typeof ExcelJS==='undefined'){toast(t('xl_missing'),'error',7000);return}
  try{const wb=buildWorkbook(scope,filled),name=fileName(scope,filled);await xlDownload(wb,name);toast('⬇ '+t('xl_ok')+': '+name,'success')}
  catch(e){console.error(e);toast(t('xl_err')+' '+e.message,'error',7000)}
}

function buildPrint(scope,filled){
  scope=resolveScope(scope);
  const forms=scopeForms(scope),os=scopeObjs(scope),P=FORMS.portada,g=k=>String(getVal(fid(P,k),'')).trim();
  const scopeName=scope==='all'?(lang==='es'?'Todo el trabajo de auditoría':'Whole audit work'):scope.startsWith('form:')?L(FORMS[scope.slice(5)]):L(GROUPS[scope.slice(6)]);
  let h=`<div class="pcover"><h1>${esc(t('app_title'))}</h1><div class="mode">${esc(t(filled?'mode_filled':'mode_blank'))}</div><p><b>${esc(t('scope_lbl'))}:</b> ${esc(scopeName)}</p>`;
  if(filled&&g('entidad'))h+=`<p><b>${esc(t('entity'))}:</b> ${esc(g('entidad'))}</p>`;
  if(filled&&g('periodo'))h+=`<p><b>${esc(L(P.fields[2]))}:</b> ${esc(g('periodo'))}</p>`;
  if(filled&&g('auditor'))h+=`<p><b>${esc(L(P.fields[3]))}:</b> ${esc(g('auditor'))}</p>`;
  h+=`<p>${esc(t('generated'))}: ${esc(new Date().toLocaleString(lang==='es'?'es-EC':'en-US'))}</p><p style="margin-top:8mm"><b>${esc(t('team'))}</b></p><ul>${MEMBERS.map(m=>`<li>${esc(m[0])}</li>`).join('')}</ul></div>`;
  const sec=d=>{
    let s=`<section class="pf"><h2>${esc(d.title)}</h2>`;if(d.intro)s+=`<p class="pi">${esc(d.intro)}</p>`;
    if(d.fields.length)s+='<table class="pt kv"><tbody>'+d.fields.map(f=>`<tr><th>${esc(f.label)}${f.req?' *':''}</th><td class="${f.tall?'tall':''}">${esc(f.value)||'&nbsp;'}</td></tr>`).join('')+'</tbody></table>';
    d.tables.forEach(tb=>{s+=(tb.title?`<h3>${esc(tb.title)}</h3>`:'')+`<table class="pt grid"><thead><tr>${tb.headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${tb.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)||'&nbsp;'}</td>`).join('')}</tr>`).join('')}</tbody></table>`});
    return s+'</section>';
  };
  if(os)h+=sec(describeSummary(os,filled));
  forms.forEach(f=>{h+=sec(describeForm(f,filled))});
  return h;
}
function doPrint(scope,filled){

/* =====================================================================
   TOAST, MODAL, COPIA DE SEGURIDAD
   ===================================================================== */
function toast(msg,type='info',ms=3200){
  const c=$('#toasts'),el=document.createElement('div');el.className='toast '+type;el.textContent=msg;c.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),350)},ms);
}
function confirmBox(msg,onOk){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog"><p>${esc(msg)}</p><div class="row"><button class="btn btn-ghost" data-c="0">${esc(t('conf_cancel'))}</button><button class="btn btn-danger" data-c="1">${esc(t('conf_ok'))}</button></div></div>`;
  bg.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){bg.remove();if(b.dataset.c==='1')onOk()}else if(e.target===bg)bg.remove()});
  document.body.appendChild(bg);
}
function exportBackup(){
  saveNow();
  dlBlob(new Blob([JSON.stringify({app:'cobit2019-grupo3',version:4,exported:new Date().toISOString(),fields:STATE},null,1)],{type:'application/json'}),'COBIT2019_copia_'+todayISO()+'.json');
}
function importBackup(file){
  const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||d.app!=='cobit2019-grupo3'||typeof d.fields!=='object')throw 0;STATE=d.fields;saveNow();render();toast(t('imported'),'success')}catch(e){toast(t('import_err'),'error')}};
  rd.readAsText(file);
}

/* =====================================================================
   TOUR GUIADO (spotlight)
   ===================================================================== */
const TOUR_SEL=[null,'#sidebar','#page','#bottomBar','#btnSave','#btnDownloads','#btnPrint','#btnLang'];
let tourI=-1;
function tourStart(){tourClose(true);go('portada');tourI=0;
  const lay=document.createElement('div');lay.id='tourLayer';lay.innerHTML='<div id="tourSpot"></div><div id="tourCard" role="dialog" aria-live="polite"></div>';
  document.body.appendChild(lay);window.addEventListener('resize',tourPlace);document.addEventListener('keydown',tourKey,true);tourShow(0)}
function tourKey(e){if(e.key==='Escape'){e.preventDefault();tourClose()}else if(e.key==='ArrowRight'){e.preventDefault();tourShow(tourI+1)}else if(e.key==='ArrowLeft'){e.preventDefault();tourShow(tourI-1)}}
function tourClose(silent){
  const l=$('#tourLayer');if(l)l.remove();window.removeEventListener('resize',tourPlace);document.removeEventListener('keydown',tourKey,true);
  document.body.classList.remove('side-open');tourI=-1;
}
function tourShow(i){
  const steps=UI[lang].tour;if(i<0)i=0;if(i>=steps.length){tourClose();return}
  tourI=i;const mobile=window.innerWidth<=960;
  if(TOUR_SEL[i]==='#sidebar'&&mobile)document.body.classList.add('side-open');else document.body.classList.remove('side-open');
  const s=steps[i],card=$('#tourCard');if(!card)return;
  card.innerHTML=`<h3><b>${i+1}</b>${esc(s.t)}</h3><p>${esc(s.d)}</p><div class="dots">${steps.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
   <div class="acts"><button class="btn btn-ghost btn-sm" data-tour="x">${esc(t('tour_skip'))}</button><div style="display:flex;gap:6px">${i>0?`<button class="btn btn-ghost btn-sm" data-tour="p">← ${esc(t('tour_prev'))}</button>`:''}<button class="btn btn-primary btn-sm" data-tour="n">${i===steps.length-1?'✔ '+esc(t('tour_done')):esc(t('tour_next'))+' →'}</button></div></div>`;
  tourPlace();
}
function tourPlace(){
  const sp=$('#tourSpot'),card=$('#tourCard');if(!sp||!card)return;
  const sel=TOUR_SEL[tourI];let el=sel?$(sel):null,r=el?el.getBoundingClientRect():null;
  if(r&&(r.width<2||r.height<2||r.right<0||r.left>innerWidth))r=null;
  const vw=innerWidth,vh=innerHeight,cw=Math.min(340,vw-24),ch=card.offsetHeight||200;
  if(!r){sp.style.cssText='left:50%;top:50%;width:0;height:0';card.style.left=Math.max(12,(vw-cw)/2)+'px';card.style.top=Math.max(12,(vh-ch)/2)+'px';return}
  const top=Math.max(r.top,6),bottom=Math.min(r.bottom,vh-6),left=Math.max(r.left,6),right=Math.min(r.right,vw-6);
  sp.style.left=(left-4)+'px';sp.style.top=(top-4)+'px';sp.style.width=(right-left+8)+'px';sp.style.height=(bottom-top+8)+'px';
  let x,y;
  if(vw-right>cw+24){x=right+14;y=Math.min(Math.max(top,12),vh-ch-12)}
  else if(vh-bottom>ch+20){x=Math.min(Math.max(left,12),vw-cw-12);y=bottom+14}
  else if(top>ch+20){x=Math.min(Math.max(left,12),vw-cw-12);y=top-ch-14}
  else{x=Math.max(12,(vw-cw)/2);y=vh-ch-90}
  card.style.left=x+'px';card.style.top=Math.max(12,y)+'px';
}

/* =====================================================================
   BÚSQUEDA
   ===================================================================== */
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function doSearch(q){
  const box=$('#searchRes');q=norm(q.trim());
  if(!q){box.classList.remove('show');box.innerHTML='';return}
  const res=STEPS.filter(s=>norm(stepTitle(s)+' '+s.id).includes(q)).slice(0,14);
  box.innerHTML=res.length?res.map(s=>`<button data-go="${s.id}">${s.icon||''} ${esc(stepTitle(s))}</button>`).join(''):`<div class="empty">${esc(t('no_results'))}</div>`;
  box.classList.add('show');
}

/* =====================================================================
   IDIOMA / TEMA / TEXTOS ESTÁTICOS
   ===================================================================== */
function applyStatic(){
  $$('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  $$('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh)});
  $('#btnLang').textContent=lang==='es'?'🌐 EN':'🌐 ES';
  $('#btnTheme').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';
  $('#progLbl').textContent=t('progress');
  document.documentElement.lang=lang;
  const sv=$('#saveInd');if(sv&&!sv.textContent)sv.textContent='💾 '+t('saved');
}
function setLang(l){lang=l;lsSet('cobit_lang',l);applyStatic();render();if($('#tourLayer'))tourShow(tourI)}
let theme=lsGet('cobit_theme')||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
function setTheme(x){theme=x;lsSet('cobit_theme',x);document.documentElement.dataset.theme=x;applyStatic();if(current==='resumen')render()}
function fitHeader(){const h=$('#top');if(h)document.documentElement.style.setProperty('--hh',h.offsetHeight+'px')}

/* =====================================================================
   EVENTOS GLOBALES
   ===================================================================== */
function handleDo(b){
  const a=b.dataset.do,sc=b.dataset.scope,fl=b.dataset.filled==='1';
  switch(a){
   case 'xlsx':exportXlsx(sc,fl);break;
   case 'print':doPrint(sc,fl);break;
   case 'prev':goRel(-1);break;
   case 'next':if(saveT)saveNow();goRel(1);break;
   case 'save':saveNow();toast('💾 '+t('saved_toast'),'success',1800);break;
   case 'validate':validateForm();break;
   case 'lang':setLang(lang==='es'?'en':'es');break;
   case 'theme':setTheme(theme==='dark'?'light':'dark');break;
   case 'tour':tourStart();break;
   case 'side':document.body.classList.toggle('side-open');break;
   case 'sec':UIS.open[b.dataset.sec]=UIS.open[b.dataset.sec]===false;renderSidebar();updateChrome();break;
   case 'bk_export':exportBackup();break;
   case 'bk_import':$('#fileIn').click();break;
   case 'clear':confirmBox(t('conf_clear'),()=>{STATE={};lsDel(LS_KEY);lsDel('cobit2019_audit');lsDel('cobit_step');render();toast(t('cleared'),'success')});break;
   case 'addrow':{const k=b.dataset.f+'.'+b.dataset.t+'.__extra';STATE[k]=String((parseInt(STATE[k])||0)+1);scheduleSave();const y=window.scrollY;render();window.scrollTo({top:y});break}
  }
}
document.addEventListener('click',e=>{
  const tr=e.target.closest('[data-tour]');if(tr){const a=tr.dataset.tour;if(a==='x')tourClose();else if(a==='n')tourShow(tourI+1);else tourShow(tourI-1);return}
  const d=e.target.closest('[data-do]');
  const g=e.target.closest('[data-go]');
  if(d){e.preventDefault();handleDo(d)}
  else if(g){e.preventDefault();go(g.dataset.go);$('#searchRes').classList.remove('show')}
  $$('details.menu[open]').forEach(m=>{if(!m.contains(e.target)||e.target.closest('[data-do]')||e.target.closest('[data-go]'))m.open=false});
  if(!e.target.closest('#searchBox'))$('#searchRes').classList.remove('show');
  if(document.body.classList.contains('side-open')&&!e.target.closest('#sidebar')&&!e.target.closest('#btnSide')&&!e.target.closest('#tourLayer'))document.body.classList.remove('side-open');
});
document.addEventListener('keydown',e=>{
  if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();goRel(1)}
  else if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();goRel(-1)}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveNow();toast('💾 '+t('saved_toast'),'success',1800)}
});
window.addEventListener('resize',fitHeader);

document.addEventListener('DOMContentLoaded',()=>{
  document.documentElement.dataset.theme=theme;
  loadState();
  const hash=(location.hash||'').replace('#',''),saved=lsGet('cobit_step');
  current=STEP_MAP[hash]?hash:STEP_MAP[saved]?saved:'portada';
  const page=$('#page');page.addEventListener('input',onEdit);page.addEventListener('change',onEdit);
  page.addEventListener('focusout',e=>{const el=e.target,id=el&&el.dataset&&el.dataset.id;if(!id)return;const f=STEP_MAP[current];if(!f||f.kind!=='form')return;
    const p=id.split('.');if(p.length===2){const fl=(f.fields||[]).find(x=>x.k===p[1]);if(fl&&fl.req)el.classList.toggle('invalid',String(el.value).trim()==='')}});
  $('#q').addEventListener('input',e=>doSearch(e.target.value));
  $('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('#searchRes button');if(b){go(b.dataset.go);$('#searchRes').classList.remove('show');e.target.blur()}}else if(e.key==='Escape'){e.target.value='';doSearch('')}});
  $('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)importBackup(f);e.target.value=''});
  applyStatic();fitHeader();render();
  if(lsGet(LS_KEY)||Object.keys(STATE).length)setInd('saved');
});
</script>
</body>
</html>
